[project]
name = "py-aniliberty"
version = "0.2.0"
description = "Async Python SDK for the AniLibria API: releases, episodes with HLS links, search, catalog with filters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "LLIJIYAPNIK", email = "kas4wot@yandex.ru" }
]
keywords = ["anilibria", "aniliberty", "anime", "api", "sdk", "async", "httpx", "pydantic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/LLIJIYAPNIK/py-aniliberty"
Documentation = "https://llijiyapnik.github.io/py-aniliberty/"
Repository = "https://github.com/LLIJIYAPNIK/py-aniliberty"
Issues = "https://github.com/LLIJIYAPNIK/py-aniliberty/issues"
Changelog = "https://github.com/LLIJIYAPNIK/py-aniliberty/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aniliberty"

[dependency-groups]
dev = [
    "coveralls>=4.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",
    "ruff>=0.6",
    "vcrpy>=6.0",
]
docs = [
    # MkDocs 2.0 drops the plugin system mkdocs-material and mkdocstrings rely on.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# The "Expected output" block at the end of each example is a verbatim copy of a real run;
# its lines can't be wrapped. Code in examples is still formatted by `ruff format`.
"examples/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["aniliberty"]

[tool.coverage.report]
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
