name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # --record-mode=none: CI never talks to the live API, every request must come from a
      # committed cassette in tests/cassettes/.
      - run: uv run --python ${{ matrix.python-version }} pytest --cov=aniliberty --cov-report=xml --cov-fail-under=95 --record-mode=none
      # One upload, not four: every leg runs the same suite, and Coveralls treats each upload
      # as its own build. Skipped while the repository secret isn't configured (and on PRs
      # from forks, which don't get secrets) instead of failing the job.
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12' && env.COVERALLS_REPO_TOKEN != ''
        run: uv run coveralls

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv build
