name: Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out `main` explicitly (not `github.ref`, which for a `release: published` event
      # is the detached tag ref) — regenerating and pushing back requires a branch.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # The one commit pushed straight to main, by design (see CLAUDE.md, "Git workflow"):
      # it only regenerates CHANGELOG.md from commits that were already reviewed.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already up to date, nothing to commit"
            exit 0
          fi
          git commit -m "docs: regenerate CHANGELOG.md for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
