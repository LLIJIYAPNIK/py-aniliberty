name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Not GitHub's starter-template default of false: merging several PRs back to back would
  # otherwise queue one deploy per push, each waiting on (and eventually timing out against)
  # the Pages backend. Only the latest commit's docs are worth deploying, so a superseded
  # run is cancelled outright.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # actions/deploy-pages gives up on its own after a 10-minute poll; bounding the job too
    # keeps a run from sitting "in progress" longer than that if its timeout ever misbehaves.
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
