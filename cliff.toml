[changelog]
header = """
# Changelog

All notable changes to this project are documented here.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the
project follows [Semantic Versioning](https://semver.org/). Entries are generated from
[Conventional Commits](https://www.conventionalcommits.org/) messages by `cliff.toml` +
`.github/workflows/changelog.yml`, which regenerates this whole file and pushes it to
`main` whenever a GitHub Release is published — don't hand-edit released sections, fix the
underlying commit message instead and let the next release regenerate this file.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}

"""
trim = true
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/LLIJIYAPNIK/py-aniliberty\
                    /compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/LLIJIYAPNIK/py-aniliberty/tree/{{ release.version }}
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
protect_breaking_commits = true

# Only commit types that describe a user-facing change get an entry: `test:`/`chore:`/
# `docs:`/`refactor:` commits are implementation detail (commits are atomic per sub-step, see
# CLAUDE.md, so there are many per feature) and would drown out what actually changed. `ci:`
# is kept: in this repository it means new automation (CI, docs deploy, publishing), which
# is worth listing. Breaking changes (`feat!:` / `BREAKING CHANGE:`) are never skipped.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^ci", group = "<!-- 3 -->Changed" },
    { message = "^refactor", skip = true },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
    { message = "^build", skip = true },
]
