site_name: py-aniliberty
site_description: Async Python SDK for the AniLibria API
site_url: https://llijiyapnik.github.io/py-aniliberty/
repo_url: https://github.com/LLIJIYAPNIK/py-aniliberty
repo_name: LLIJIYAPNIK/py-aniliberty
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Pagination: guides/pagination.md
      - Catalog filters: guides/catalog-filters.md
      - Errors and retries: guides/errors.md
      - Concurrency: guides/concurrency.md
      - Mirrors and custom HTTP client: guides/custom-http-client.md
      - Response cache: guides/caching.md
      - Authentication and account: guides/authentication.md
  - Examples: examples.md
  - API reference: reference.md
  - Endpoints: endpoints.md
  - API notes: api-notes.md
  - Upgrading to 1.0: upgrading.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - tables
  - toc:
      permalink: true
  # docs/changelog.md pulls in the repository-root CHANGELOG.md, so there's one source.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
